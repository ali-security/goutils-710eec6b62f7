name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: '1.10'

      - name: Build
        working-directory: src
        run: |
          go version
          go build -v .

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Pack module zip
        run: |
          mkdir -p "$RUNNER_TEMP/packer" "$RUNNER_TEMP/out"
          cp -a src "$RUNNER_TEMP/modsrc"
          # .github/ holds only this Seal CI workflow (upstream ships none), not module content
          rm -rf "$RUNNER_TEMP/modsrc/.github"
          cd "$RUNNER_TEMP/packer"
          cat > create_mod.go <<'EOF'
          package main

          import (
            "log"
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
          )

          func main() {
            m := module.Version{Path: os.Args[1], Version: os.Args[2]}
            f, err := os.Create(os.Args[4])
            if err != nil {
              log.Fatal(err)
            }
            defer f.Close()
            if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
              log.Fatal(err)
            }
            log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          go mod init example.com/packer
          go get golang.org/x/mod@v0.14.0
          go run create_mod.go github.com/Masterminds/goutils v1.1.0 "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/out/v1.1.0.zip"
          unzip -l "$RUNNER_TEMP/out/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v1.1.0.zip
